<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>١٠٠ حديث للحفظ</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe2;--card:#fffdf6;--ink:#1d2b1f;--g:#2f6b3a;--gold:#b8892b;--mut:#6b6f62;--line:#e2d8bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a13;--card:#17251b;--ink:#eee8d5;--g:#6fbf7e;--gold:#d9ab4a;--mut:#a3aa98;--line:#2a3d2e}}
:root[data-theme="dark"]{--bg:#101a13;--card:#17251b;--ink:#eee8d5;--g:#6fbf7e;--gold:#d9ab4a;--mut:#a3aa98;--line:#2a3d2e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Amiri','Traditional Arabic',serif;display:flex;flex-direction:column;align-items:center;padding:14px;overflow-x:hidden}
.top{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mut);font-size:1.05rem}
.bar{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--gold));transition:width .5s}
main{flex:1;width:100%;max-width:640px;display:flex;align-items:center;padding:14px 0}
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 22px 24px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
.card::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold);border-radius:16px;opacity:.45;pointer-events:none}
.num{width:64px;height:64px;margin:-62px auto 14px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:700;border:4px solid var(--bg);box-shadow:0 0 0 2px var(--gold)}
.who{color:var(--gold);font-size:1.15rem;margin-bottom:12px}
.txt{font-size:clamp(1.35rem,4.6vw,1.9rem);line-height:2.5;min-height:10rem;display:flex;align-items:center;justify-content:center;padding:4px 6px}
.src{margin-top:12px;color:var(--mut);font-size:1.05rem;border-top:1px dashed var(--line);padding-top:12px}
.anim-in{animation:in .45s ease both}
.anim-out{animation:out .22s ease both}
@keyframes in{from{opacity:0;transform:translateX(var(--d,-40px)) scale(.97)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(calc(var(--d,-40px) * -1)) scale(.97)}}
nav{width:100%;max-width:640px;display:flex;gap:10px;align-items:center;padding-bottom:6px}
button{font:inherit;font-size:1.25rem;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;background:var(--card);color:var(--g);border:1px solid var(--line);transition:transform .15s}
button:active{transform:scale(.95)}
#next{flex:1;background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
button:disabled{opacity:.35}
input{width:70px;font:inherit;font-size:1.1rem;text-align:center;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sh{width:100%;max-width:640px;display:flex;gap:10px;padding-bottom:10px}.sh button{flex:1;font-size:1.1rem}#wa{background:#25a244;color:#fff;border-color:#25a244}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}</style>
</head>
<body>
<div class="top"><span>١٠٠ حديث للحفظ</span><div class="bar"><i id="pg"></i></div><span id="cnt"></span></div>
<main><div class="card" id="card"><div class="num" id="n"></div><div class="who" id="who"></div><div class="txt" id="t"></div><div class="src" id="s"></div></div></main>
<div class="sh"><button id="cp">نسخ الحديث</button></div><div id="toast">تم النسخ</div>
<nav><button id="prev" aria-label="السابق">السابق ›</button><button id="next">‹ التالي</button><input id="go" type="number" min="1" max="100" placeholder="رقم" inputmode="numeric"></nav>
<script>
const P="قال رسول الله ﷺ: ";
const H=[
"~«كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللهِ وَبِحَمْدِهِ، سُبْحَانَ اللهِ الْعَظِيمِ».",
"جَاءَ رَجُلٌ إِلَى رَسُولِ اللهِ ﷺ فَقَالَ: يَا رَسُولَ اللهِ، مَنْ أَحَقُّ النَّاسِ بِحُسْنِ صَحَابَتِي؟ قَالَ: «أُمُّكَ» قَالَ: ثُمَّ مَنْ؟ قَالَ: «أُمُّكَ» قَالَ: ثُمَّ مَنْ؟ قَالَ: «أُمُّكَ» قَالَ: ثُمَّ مَنْ؟ قَالَ: «ثُمَّ أَبُوكَ».",
"~«إِيَّاكُمْ وَالظَّنَّ، فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ».",
"~«إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ مَا يَتَبَيَّنُ فِيهَا، يَزِلُّ بِهَا فِي النَّارِ أَبْعَدَ مَا بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ».",
"~«إِنَّ اللهَ يَغَارُ، وَغَيْرَةُ اللهِ أَنْ يَأْتِيَ الْمُؤْمِنُ مَا حَرَّمَ اللهُ».",
"~«مَنْ قَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ».",
"~«الْعُمْرَةُ إِلَى الْعُمْرَةِ كَفَّارَةٌ لِمَا بَيْنَهُمَا، وَالْحَجُّ الْمَبْرُورُ لَيْسَ لَهُ جَزَاءٌ إِلَّا الْجَنَّةُ».",
"~«التَّثَاؤُبُ مِنَ الشَّيْطَانِ، فَإِذَا تَثَاءَبَ أَحَدُكُمْ فَلْيَرُدَّهُ مَا اسْتَطَاعَ».",
"~«السَّاعِي عَلَى الْأَرْمَلَةِ وَالْمِسْكِينِ كَالْمُجَاهِدِ فِي سَبِيلِ اللهِ» وَأَحْسِبُهُ قَالَ: «وَكَالْقَائِمِ لَا يَفْتُرُ، وَكَالصَّائِمِ لَا يُفْطِرُ».",
"~«مَا يُصِيبُ الْمُسْلِمَ مِنْ نَصَبٍ وَلَا وَصَبٍ وَلَا هَمٍّ وَلَا حُزْنٍ وَلَا أَذًى وَلَا غَمٍّ، حَتَّى الشَّوْكَةِ يُشَاكُهَا، إِلَّا كَفَّرَ اللهُ بِهَا مِنْ خَطَايَاهُ».",
"~«حَقُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ خَمْسٌ: رَدُّ السَّلَامِ، وَعِيَادَةُ الْمَرِيضِ، وَاتِّبَاعُ الْجَنَائِزِ، وَإِجَابَةُ الدَّعْوَةِ، وَتَشْمِيتُ الْعَاطِسِ».",
"~«مَنْ شَهِدَ الْجَنَازَةَ حَتَّى يُصَلَّى عَلَيْهَا فَلَهُ قِيرَاطٌ، وَمَنْ شَهِدَ حَتَّى تُدْفَنَ فَلَهُ قِيرَاطَانِ» قِيلَ: وَمَا الْقِيرَاطَانِ؟ قَالَ: «مِثْلُ الْجَبَلَيْنِ الْعَظِيمَيْنِ».",
"مَا عَابَ النَّبِيُّ ﷺ طَعَامًا قَطُّ، إِنِ اشْتَهَاهُ أَكَلَهُ، وَإِنْ كَرِهَهُ تَرَكَهُ.",
"~«حُجِبَتِ النَّارُ بِالشَّهَوَاتِ، وَحُجِبَتِ الْجَنَّةُ بِالْمَكَارِهِ».",
"~«إِذَا قُلْتَ لِصَاحِبِكَ يَوْمَ الْجُمُعَةِ: أَنْصِتْ، وَالْإِمَامُ يَخْطُبُ، فَقَدْ لَغَوْتَ».",
"~«لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ عِنْدَ كُلِّ صَلَاةٍ».",
"~«وَيْلٌ لِلْأَعْقَابِ مِنَ النَّارِ».",
"~«أَمَا يَخْشَى الَّذِي يَرْفَعُ رَأْسَهُ قَبْلَ الْإِمَامِ أَنْ يُحَوِّلَ اللهُ رَأْسَهُ رَأْسَ حِمَارٍ».",
"~«مَنْ غَدَا إِلَى الْمَسْجِدِ أَوْ رَاحَ، أَعَدَّ اللهُ لَهُ فِي الْجَنَّةِ نُزُلًا كُلَّمَا غَدَا أَوْ رَاحَ».",
"~«آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ».",
"~«مَا أَسْفَلَ مِنَ الْكَعْبَيْنِ مِنَ الْإِزَارِ فَفِي النَّارِ».",
"~«الْمَلَائِكَةُ تُصَلِّي عَلَى أَحَدِكُمْ مَا دَامَ فِي مُصَلَّاهُ الَّذِي صَلَّى فِيهِ مَا لَمْ يُحْدِثْ، تَقُولُ: اللَّهُمَّ اغْفِرْ لَهُ، اللَّهُمَّ ارْحَمْهُ».",
"~«كُلُّ أُمَّتِي يَدْخُلُونَ الْجَنَّةَ إِلَّا مَنْ أَبَى» قَالُوا: يَا رَسُولَ اللهِ، وَمَنْ يَأْبَى؟ قَالَ: «مَنْ أَطَاعَنِي دَخَلَ الْجَنَّةَ، وَمَنْ عَصَانِي فَقَدْ أَبَى».",
"~«إِذَا قَالَ الرَّجُلُ لِأَخِيهِ: يَا كَافِرُ، فَقَدْ بَاءَ بِهَا أَحَدُهُمَا».",
"~«لَلَّهُ أَشَدُّ فَرَحًا بِتَوْبَةِ أَحَدِكُمْ مِنْ أَحَدِكُمْ بِضَالَّتِهِ إِذَا وَجَدَهَا».",
"~«لَا تَدْخُلُوا الْجَنَّةَ حَتَّى تُؤْمِنُوا، وَلَا تُؤْمِنُوا حَتَّى تَحَابُّوا، أَوَلَا أَدُلُّكُمْ عَلَى شَيْءٍ إِذَا فَعَلْتُمُوهُ تَحَابَبْتُمْ؟ أَفْشُوا السَّلَامَ بَيْنَكُمْ».",
"~«الصَّلَوَاتُ الْخَمْسُ، وَالْجُمُعَةُ إِلَى الْجُمُعَةِ، وَرَمَضَانُ إِلَى رَمَضَانَ، مُكَفِّرَاتٌ مَا بَيْنَهُنَّ إِذَا اجْتُنِبَتِ الْكَبَائِرُ».",
"~«أَفْضَلُ الصِّيَامِ بَعْدَ رَمَضَانَ شَهْرُ اللهِ الْمُحَرَّمُ، وَأَفْضَلُ الصَّلَاةِ بَعْدَ الْفَرِيضَةِ صَلَاةُ اللَّيْلِ».",
"~«مَنْ تَابَ قَبْلَ أَنْ تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا تَابَ اللهُ عَلَيْهِ».",
"~«جُزُّوا الشَّوَارِبَ، وَأَرْخُوا اللِّحَى، خَالِفُوا الْمَجُوسَ».",
"~«لَأَنْ أَقُولَ: سُبْحَانَ اللهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللهُ، وَاللهُ أَكْبَرُ، أَحَبُّ إِلَيَّ مِمَّا طَلَعَتْ عَلَيْهِ الشَّمْسُ».",
"~«مَنْ حَمَلَ عَلَيْنَا السِّلَاحَ فَلَيْسَ مِنَّا، وَمَنْ غَشَّنَا فَلَيْسَ مِنَّا».",
"~«إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ: إِلَّا مِنْ صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ».",
"~«لَقِّنُوا مَوْتَاكُمْ: لَا إِلَهَ إِلَّا اللهُ».",
"~«مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ».",
"~«مَنْ دَعَا إِلَى هُدًى كَانَ لَهُ مِنَ الْأَجْرِ مِثْلُ أُجُورِ مَنْ تَبِعَهُ، لَا يَنْقُصُ ذَلِكَ مِنْ أُجُورِهِمْ شَيْئًا، وَمَنْ دَعَا إِلَى ضَلَالَةٍ كَانَ عَلَيْهِ مِنَ الْإِثْمِ مِثْلُ آثَامِ مَنْ تَبِعَهُ، لَا يَنْقُصُ ذَلِكَ مِنْ آثَامِهِمْ شَيْئًا».",
"~«قَالَ اللهُ تَبَارَكَ وَتَعَالَى: أَنَا أَغْنَى الشُّرَكَاءِ عَنِ الشِّرْكِ، مَنْ عَمِلَ عَمَلًا أَشْرَكَ فِيهِ مَعِي غَيْرِي تَرَكْتُهُ وَشِرْكَهُ».",
"~«مَنْ صَلَّى عَلَيَّ وَاحِدَةً، صَلَّى اللهُ عَلَيْهِ عَشْرًا».",
"~«كُلُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ حَرَامٌ: دَمُهُ وَمَالُهُ وَعِرْضُهُ».",
"~«مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ، وَمَا زَادَ اللهُ عَبْدًا بِعَفْوٍ إِلَّا عِزًّا، وَمَا تَوَاضَعَ أَحَدٌ لِلَّهِ إِلَّا رَفَعَهُ اللهُ».",
"~«أَتَدْرُونَ مَا الْغِيبَةُ؟» قَالُوا: اللهُ وَرَسُولُهُ أَعْلَمُ، قَالَ: «ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ» قِيلَ: أَفَرَأَيْتَ إِنْ كَانَ فِي أَخِي مَا أَقُولُ؟ قَالَ: «إِنْ كَانَ فِيهِ مَا تَقُولُ فَقَدِ اغْتَبْتَهُ، وَإِنْ لَمْ يَكُنْ فِيهِ فَقَدْ بَهَتَّهُ».",
"~«سَبَقَ الْمُفَرِّدُونَ» قَالُوا: وَمَا الْمُفَرِّدُونَ يَا رَسُولَ اللهِ؟ قَالَ: «الذَّاكِرُونَ اللهَ كَثِيرًا وَالذَّاكِرَاتُ».",
"~«إِنَّ اللهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ، وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ».",
"~«لَا تَجْعَلُوا بُيُوتَكُمْ مَقَابِرَ، إِنَّ الشَّيْطَانَ يَنْفِرُ مِنَ الْبَيْتِ الَّذِي تُقْرَأُ فِيهِ سُورَةُ الْبَقَرَةِ».",
"~«لَا يَدْخُلُ الْجَنَّةَ مَنْ لَا يَأْمَنُ جَارُهُ بَوَائِقَهُ».",
"~«أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ، فَأَكْثِرُوا الدُّعَاءَ».",
"~«مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ».",
"~«إِنَّ اللهَ يَقُولُ يَوْمَ الْقِيَامَةِ: أَيْنَ الْمُتَحَابُّونَ بِجَلَالِي؟ الْيَوْمَ أُظِلُّهُمْ فِي ظِلِّي يَوْمَ لَا ظِلَّ إِلَّا ظِلِّي».",
"~«إِذَا أُقِيمَتِ الصَّلَاةُ فَلَا صَلَاةَ إِلَّا الْمَكْتُوبَةُ».",
"~«الدُّنْيَا سِجْنُ الْمُؤْمِنِ وَجَنَّةُ الْكَافِرِ».",
"~«مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ».",
"~«أَحَبُّ الْأَعْمَالِ إِلَى اللهِ تَعَالَى أَدْوَمُهَا وَإِنْ قَلَّ».",
"~«مَنْ نَذَرَ أَنْ يُطِيعَ اللهَ فَلْيُطِعْهُ، وَمَنْ نَذَرَ أَنْ يَعْصِيَ اللهَ فَلَا يَعْصِهِ».",
"~«لَا تَسُبُّوا الْأَمْوَاتَ؛ فَإِنَّهُمْ قَدْ أَفْضَوْا إِلَى مَا قَدَّمُوا».",
"كَانَ النَّبِيُّ ﷺ لَا يَدَعُ أَرْبَعًا قَبْلَ الظُّهْرِ، وَرَكْعَتَيْنِ قَبْلَ الْغَدَاةِ.",
"كَانَ النَّبِيُّ ﷺ يُحِبُّ التَّيَمُّنَ مَا اسْتَطَاعَ فِي شَأْنِهِ كُلِّهِ، فِي طُهُورِهِ وَتَرَجُّلِهِ وَتَنَعُّلِهِ.",
"كَانَ النَّبِيُّ ﷺ يَذْكُرُ اللهَ عَلَى كُلِّ أَحْيَانِهِ.",
"~«رَكْعَتَا الْفَجْرِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا».",
"~«إِنَّ الرِّفْقَ لَا يَكُونُ فِي شَيْءٍ إِلَّا زَانَهُ، وَلَا يُنْزَعُ مِنْ شَيْءٍ إِلَّا شَانَهُ».",
"~«لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ».",
"~«مَا مِنْ مُسْلِمٍ يَغْرِسُ غَرْسًا، أَوْ يَزْرَعُ زَرْعًا، فَيَأْكُلُ مِنْهُ طَيْرٌ أَوْ إِنْسَانٌ أَوْ بَهِيمَةٌ، إِلَّا كَانَ لَهُ بِهِ صَدَقَةٌ».",
"~«مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَيُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ».",
"كَانَ أَكْثَرُ دُعَاءِ النَّبِيِّ ﷺ: «اللَّهُمَّ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً، وَفِي الْآخِرَةِ حَسَنَةً، وَقِنَا عَذَابَ النَّارِ».",
"~«إِنَّمَا الصَّبْرُ عِنْدَ الصَّدْمَةِ الْأُولَى».",
"~«يَتْبَعُ الْمَيِّتَ ثَلَاثَةٌ، فَيَرْجِعُ اثْنَانِ وَيَبْقَى مَعَهُ وَاحِدٌ: يَتْبَعُهُ أَهْلُهُ وَمَالُهُ وَعَمَلُهُ، فَيَرْجِعُ أَهْلُهُ وَمَالُهُ، وَيَبْقَى عَمَلُهُ».",
"~«يَسِّرُوا وَلَا تُعَسِّرُوا، وَبَشِّرُوا وَلَا تُنَفِّرُوا».",
"~«سَوُّوا صُفُوفَكُمْ؛ فَإِنَّ تَسْوِيَةَ الصُّفُوفِ مِنْ إِقَامَةِ الصَّلَاةِ».",
"~«إِنَّ اللهَ لَيَرْضَى عَنِ الْعَبْدِ أَنْ يَأْكُلَ الْأَكْلَةَ فَيَحْمَدَهُ عَلَيْهَا، أَوْ يَشْرَبَ الشَّرْبَةَ فَيَحْمَدَهُ عَلَيْهَا».",
"~«لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ».",
"~«مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ».",
"~«اجْعَلُوا آخِرَ صَلَاتِكُمْ بِاللَّيْلِ وِتْرًا».",
"~«مَا يَزَالُ الرَّجُلُ يَسْأَلُ النَّاسَ حَتَّى يَأْتِيَ يَوْمَ الْقِيَامَةِ لَيْسَ فِي وَجْهِهِ مُزْعَةُ لَحْمٍ».",
"~«الَّذِي تَفُوتُهُ صَلَاةُ الْعَصْرِ فَكَأَنَّمَا وُتِرَ أَهْلَهُ وَمَالَهُ».",
"~«الْمُسْلِمُ أَخُو الْمُسْلِمِ، لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللهُ فِي حَاجَتِهِ، وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللهُ عَنْهُ بِهَا كُرْبَةً مِنْ كُرُبَاتِ يَوْمِ الْقِيَامَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللهُ يَوْمَ الْقِيَامَةِ».",
"أَخَذَ رَسُولُ اللهِ ﷺ بِمَنْكِبِي فَقَالَ: «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ».",
"~«الظُّلْمُ ظُلُمَاتٌ يَوْمَ الْقِيَامَةِ».",
"~«الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ، وَالْمُهَاجِرُ مَنْ هَجَرَ مَا نَهَى اللهُ عَنْهُ».",
"~«كُلُّ مُسْكِرٍ خَمْرٌ، وَكُلُّ مُسْكِرٍ حَرَامٌ».",
"~«إِنَّ أَبَرَّ الْبِرِّ أَنْ يَصِلَ الرَّجُلُ وُدَّ أَبِيهِ».",
"~«لَا حَسَدَ إِلَّا فِي اثْنَتَيْنِ: رَجُلٌ آتَاهُ اللهُ الْقُرْآنَ فَهُوَ يَتْلُوهُ آنَاءَ اللَّيْلِ وَآنَاءَ النَّهَارِ، وَرَجُلٌ آتَاهُ اللهُ مَالًا فَهُوَ يُنْفِقُهُ آنَاءَ اللَّيْلِ وَآنَاءَ النَّهَارِ».",
"~«لَا تَأْكُلُوا بِالشِّمَالِ؛ فَإِنَّ الشَّيْطَانَ يَأْكُلُ بِالشِّمَالِ».",
"~«مَنْ لَقِيَ اللهَ لَا يُشْرِكُ بِهِ شَيْئًا دَخَلَ الْجَنَّةَ، وَمَنْ لَقِيَهُ يُشْرِكُ بِهِ شَيْئًا دَخَلَ النَّارَ».",
"~«إِنَّ بَيْنَ الرَّجُلِ وَبَيْنَ الشِّرْكِ وَالْكُفْرِ تَرْكَ الصَّلَاةِ».",
"~«يُبْعَثُ كُلُّ عَبْدٍ عَلَى مَا مَاتَ عَلَيْهِ».",
"~«مَنْ أَتَى عَرَّافًا فَسَأَلَهُ عَنْ شَيْءٍ لَمْ تُقْبَلْ لَهُ صَلَاةٌ أَرْبَعِينَ لَيْلَةً».",
"~«إِنَّ أَشَدَّ النَّاسِ عَذَابًا عِنْدَ اللهِ يَوْمَ الْقِيَامَةِ الْمُصَوِّرُونَ».",
"~«مَنْ قَرَأَ بِالْآيَتَيْنِ مِنْ آخِرِ سُورَةِ الْبَقَرَةِ فِي لَيْلَةٍ كَفَتَاهُ».",
"~«لَعْنُ الْمُؤْمِنِ كَقَتْلِهِ».",
"~«لَا تَحْقِرَنَّ مِنَ الْمَعْرُوفِ شَيْئًا، وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ».",
"~«مَا مِنْ عَبْدٍ مُسْلِمٍ يَدْعُو لِأَخِيهِ بِظَهْرِ الْغَيْبِ إِلَّا قَالَ الْمَلَكُ: وَلَكَ بِمِثْلٍ».",
"~«مَنْ يُرِدِ اللهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ».",
"~«إِذَا سَمِعْتُمُ النِّدَاءَ فَقُولُوا مِثْلَ مَا يَقُولُ الْمُؤَذِّنُ».",
"~«إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيَرْكَعْ رَكْعَتَيْنِ قَبْلَ أَنْ يَجْلِسَ».",
"~«مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لَا يَذْكُرُ رَبَّهُ مَثَلُ الْحَيِّ وَالْمَيِّتِ».",
"~«نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالْفَرَاغُ».",
"~«خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ».",
"~«مَنْ تَوَضَّأَ فَأَحْسَنَ الْوُضُوءَ خَرَجَتْ خَطَايَاهُ مِنْ جَسَدِهِ حَتَّى تَخْرُجَ مِنْ تَحْتِ أَظْفَارِهِ».",
"~«مَنْ صَلَّى الْعِشَاءَ فِي جَمَاعَةٍ فَكَأَنَّمَا قَامَ نِصْفَ اللَّيْلِ، وَمَنْ صَلَّى الصُّبْحَ فِي جَمَاعَةٍ فَكَأَنَّمَا صَلَّى اللَّيْلَ كُلَّهُ».",
"~«مَنْ صَامَ رَمَضَانَ ثُمَّ أَتْبَعَهُ سِتًّا مِنْ شَوَّالٍ كَانَ كَصِيَامِ الدَّهْرِ».",
"~«مَنْ سَأَلَ اللهَ الشَّهَادَةَ بِصِدْقٍ بَلَّغَهُ اللهُ مَنَازِلَ الشُّهَدَاءِ وَإِنْ مَاتَ عَلَى فِرَاشِهِ»."
];
const S="MMMMMMMMMMMMMMMMMMMMBBBBSSSSSSSSSSSSSSSSSSSSSSSSSSMMBBBBSSSMMMMMMMMSMMMMMMBBBSSMSSSSSMBMSSMMMBBBSSSS";
const SN={M:"متفق عليه",B:"رواه البخاري",S:"رواه مسلم"};
const R=[[50,"أبو هريرة"],[59,"عائشة"],[69,"أنس بن مالك"],[80,"عبد الله بن عمر"],[84,"جابر بن عبد الله"],[85,"بعض أزواج النبي ﷺ"],[87,"عبد الله بن مسعود"],[88,"ثابت بن الضحاك"],[89,"أبو ذر"],[90,"أبو الدرداء"],[91,"معاوية"],[92,"أبو سعيد الخدري"],[93,"أبو قتادة"],[94,"أبو موسى الأشعري"],[95,"ابن عباس"],[98,"عثمان بن عفان"],[99,"أبو أيوب الأنصاري"],[100,"سهل بن حنيف"]];
const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const $=id=>document.getElementById(id);
let i=0,busy=false;
function render(){
  const n=i+1;
  $("n").textContent=ar(n);
  $("who").textContent="عن "+R.find(r=>n<=r[0])[1]+(n>=51&&n<=59||n==85?" رضي الله عنها":" رضي الله عنه").replace("عنها",n==85?"عنهن":"عنها");
  $("t").textContent=H[i].replace("~",P);
  $("s").textContent=SN[S[i]];
  $("cnt").textContent=ar(n)+" / ١٠٠";
  $("pg").style.width=n+"%";
  $("prev").disabled=i==0;
  $("next").textContent=i==99?"من البداية":"‹ التالي";
  try{history.replaceState(null,"","#h"+n)}catch(e){}
}
function go(k,d){
  if(busy||k<0||k>99)return;
  busy=true;const c=$("card");
  c.style.setProperty("--d",(d||-40)+"px");
  c.className="card anim-out";
  setTimeout(()=>{i=k;render();c.className="card anim-in";setTimeout(()=>busy=false,420)},220);
}
$("next").onclick=()=>go(i==99?0:i+1,-40);
$("prev").onclick=()=>go(i-1,40);
$("go").onchange=e=>{const v=+e.target.value;if(v>=1&&v<=100)go(v-1,v>i+1?-40:40);e.target.value=""};
addEventListener("keydown",e=>{if(e.key=="ArrowLeft")$("next").click();if(e.key=="ArrowRight")$("prev").click()});
let x0=null;
addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx>60)$("next").click();else if(dx<-60)$("prev").click()});

function msg(){const n=i+1;return H[i].replace("~",P)+"\n\n— "+$("who").textContent+"، "+SN[S[i]]+"\n(الحديث "+ar(n)+" من ١٠٠)"}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1600)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast("تم النسخ"),()=>fb(t))}catch(e){fb(t)}}
function fb(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("تم النسخ")}catch(e){}a.remove()}
$("cp").onclick=()=>copy(msg());
const m=location.hash.match(/^#h(\d+)$/);if(m&&m[1]>=1&&m[1]<=100)i=m[1]-1;
render();$("card").className="card anim-in";
</script>
</body>
</html>
